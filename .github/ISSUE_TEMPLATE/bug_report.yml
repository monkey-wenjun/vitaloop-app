name: Bug report
description: Report a reproducible problem without private health data
body:
  - type: markdown
    attributes:
      value: |
        Do not include health databases, `.legacy/`, tokens, watch credentials,
        signing keys, server addresses, or unsanitized logs.
  - type: input
    id: version
    attributes:
      label: Vitaloop version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device and OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove private endpoints, account identifiers, and health data.
